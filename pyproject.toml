[project]
name = "guitar-buddy"
version = "0.1.0"
description = "Turn plain-text chord voicing lists into Guitar Pro files with chord diagrams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyguitarpro>=0.11",
]

[project.scripts]
guitar-buddy = "guitar_buddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_buddy"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
